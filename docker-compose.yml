services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    ports: ["1883:1883", "9001:9001"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  flower-server:
    build: ./federated-learning
    command: ["python", "server.py", "--rounds", "5", "--min-clients", "3", "--port", "8080"]
    environment: {METRICS_FILE: /runtime/federated_metrics.json}
    ports: ["8084:8080"]
    volumes: ["./runtime:/runtime"]

  dashboard-api:
    build: ./dashboard
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: "1883"
      METRICS_FILE: /runtime/federated_metrics.json
      LOCAL_DATA_DIR: /data
      EDC_CONNECTORS: http://edc-factory-a:8080,http://edc-factory-b:8080,http://edc-factory-c:8080
    ports: ["8000:8000"]
    volumes: ["./runtime:/runtime:ro", "./iot-simulation/data:/data:ro"]
    depends_on: [mqtt-broker, flower-server]

  dashboard:
    build: ./dashboard
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0"]
    environment: {DASHBOARD_API_URL: http://dashboard-api:8000}
    ports: ["8501:8501"]
    depends_on: [dashboard-api]

  iot-factory-a: &iot-factory
    build: ./iot-simulation
    command: ["python", "runner.py", "--factory-id", "FactoryA", "--data-dir", "/data", "--broker", "mqtt-broker"]
    volumes: ["./iot-simulation/data:/data"]
    depends_on: [mqtt-broker]

  iot-factory-b:
    <<: *iot-factory
    command: ["python", "runner.py", "--factory-id", "FactoryB", "--data-dir", "/data", "--broker", "mqtt-broker"]

  iot-factory-c:
    <<: *iot-factory
    command: ["python", "runner.py", "--factory-id", "FactoryC", "--data-dir", "/data", "--broker", "mqtt-broker"]

  ml-client-a: &ml-client
    build: ./federated-learning
    image: data2-flower-server:latest
    command: ["python", "client.py", "--factory-id", "FactoryA", "--data-dir", "/data/FactoryA", "--server-address", "flower-server:8080"]
    volumes: ["./iot-simulation/data:/data:ro"]
    depends_on: [flower-server, iot-factory-a]

  ml-client-b:
    <<: *ml-client
    command: ["python", "client.py", "--factory-id", "FactoryB", "--data-dir", "/data/FactoryB", "--server-address", "flower-server:8080"]
    depends_on: [flower-server, iot-factory-b]

  ml-client-c:
    <<: *ml-client
    command: ["python", "client.py", "--factory-id", "FactoryC", "--data-dir", "/data/FactoryC", "--server-address", "flower-server:8080"]
    depends_on: [flower-server, iot-factory-c]

  edc-factory-a: &edc
    image: tractusx/edc-runtime-memory:0.13.0
    environment: &edc-environment
      EDC_PARTICIPANT_ID: did:web:factory-a
      EDC_IAM_ISSUER_ID: did:web:factory-a
      EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: application/json
      EDC_PARTICIPANT_CONTEXT_ID: factory-a-context
      TRACTUSX_EDC_PARTICIPANT_BPN: factory-a
      WEB_HTTP_MANAGEMENT_AUTH_KEY: password
      WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
      TX_EDC_DPF_CONSUMER_PROXY_AUTH_APIKEY: password
      WEB_HTTP_PORT: "8080"
      WEB_HTTP_PATH: /api
      WEB_HTTP_MANAGEMENT_PORT: "8081"
      WEB_HTTP_MANAGEMENT_PATH: /management
      WEB_HTTP_CONTROL_PORT: "8083"
      WEB_HTTP_CONTROL_PATH: /control
      WEB_HTTP_PROTOCOL_PORT: "8084"
      WEB_HTTP_PROTOCOL_PATH: /api/v1/dsp
      WEB_HTTP_PUBLIC_PORT: "8086"
      WEB_HTTP_PUBLIC_PATH: /api/public
      EDC_OAUTH_PROVIDER_AUDIENCE: idsc:IDS_CONNECTORS_ALL
      EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS: key-1
      EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS: key-1
      TX_EDC_VAULT_SECRETS: key-1:secret;client-secret:secret
      EDC_IAM_STS_OAUTH_TOKEN_URL: http://localhost/token
      EDC_IAM_STS_OAUTH_CLIENT_ID: local-demo
      EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: client-secret
      TX_EDC_IAM_DCP_BDRS_SERVER_URL: http://localhost/bdrs
      EDC_DSP_CALLBACK_ADDRESS: http://edc-factory-a:8084/api/v1/dsp
      EDC_OAUTH_ENDPOINT_AUDIENCE: http://edc-factory-a:8084/api/v1/dsp
    ports:
      - "8080:8080"
      - "8180:8081"
      - "8280:8084"
      - "8380:8086"
      - "8480:8186"

  edc-factory-b:
    <<: *edc
    environment:
      <<: *edc-environment
      EDC_PARTICIPANT_ID: did:web:factory-b
      EDC_IAM_ISSUER_ID: did:web:factory-b
      EDC_PARTICIPANT_CONTEXT_ID: factory-b-context
      TRACTUSX_EDC_PARTICIPANT_BPN: factory-b
      EDC_DSP_CALLBACK_ADDRESS: http://edc-factory-b:8084/api/v1/dsp
      EDC_OAUTH_ENDPOINT_AUDIENCE: http://edc-factory-b:8084/api/v1/dsp
    ports:
      - "8081:8080"
      - "8181:8081"
      - "8281:8084"
      - "8381:8086"
      - "8481:8186"

  edc-factory-c:
    <<: *edc
    environment:
      <<: *edc-environment
      EDC_PARTICIPANT_ID: did:web:factory-c
      EDC_IAM_ISSUER_ID: did:web:factory-c
      EDC_PARTICIPANT_CONTEXT_ID: factory-c-context
      TRACTUSX_EDC_PARTICIPANT_BPN: factory-c
      EDC_DSP_CALLBACK_ADDRESS: http://edc-factory-c:8084/api/v1/dsp
      EDC_OAUTH_ENDPOINT_AUDIENCE: http://edc-factory-c:8084/api/v1/dsp
    ports:
      - "8082:8080"
      - "8182:8081"
      - "8282:8084"
      - "8382:8086"
      - "8482:8186"

  edc-bootstrap:
    image: curlimages/curl:8.10.1
    depends_on:
      edc-factory-a:
        condition: service_started
      edc-factory-b:
        condition: service_started
      edc-factory-c:
        condition: service_started
    environment:
      EDC_API_KEY: password
    volumes:
      - ./data-space/edc-connector/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
