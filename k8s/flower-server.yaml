apiVersion: v1
kind: ConfigMap
metadata:
  name: flower-server-config
  namespace: industrial-data-space
  labels:
    app: flower-server
    component: federated-learning
data:
  FLOWER_ROUNDS: "10"
  FLOWER_MIN_CLIENTS: "2"
  FLOWER_PORT: "8080"
  FLOWER_SAVE_EVERY: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower-server
  namespace: industrial-data-space
  labels:
    app: flower-server
    component: federated-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower-server
  template:
    metadata:
      labels:
        app: flower-server
        component: federated-learning
    spec:
      containers:
        - name: flower-server
          image: industrial-data-space/federated-learning:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flower-server-config
          env:
            - name: METRICS_FILE
              value: /runtime/federated_metrics.json
          command:
            - python
            - server.py
            - --rounds
            - $(FLOWER_ROUNDS)
            - --min-clients
            - $(FLOWER_MIN_CLIENTS)
            - --port
            - $(FLOWER_PORT)
            - --save-every
            - $(FLOWER_SAVE_EVERY)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: checkpoint-storage
              mountPath: /app/checkpoints
            - name: metrics-storage
              mountPath: /runtime
      volumes:
        - name: checkpoint-storage
          emptyDir: {}
        - name: metrics-storage
          persistentVolumeClaim:
            claimName: federated-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: flower-server
  namespace: industrial-data-space
  labels:
    app: flower-server
    component: federated-learning
spec:
  type: ClusterIP
  selector:
    app: flower-server
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
      protocol: TCP
