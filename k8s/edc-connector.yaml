---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edc-config-factory-a
  namespace: industrial-data-space
  labels:
    app: edc-connector
    factory: factory-a
data:
  config.properties: |
    edc.connector.name=FactoryA
    edc.connector.ids.id=urn:connector:factory-a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edc-config-factory-b
  namespace: industrial-data-space
  labels:
    app: edc-connector
    factory: factory-b
data:
  config.properties: |
    edc.connector.name=FactoryB
    edc.connector.ids.id=urn:connector:factory-b
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edc-config-factory-c
  namespace: industrial-data-space
  labels:
    app: edc-connector
    factory: factory-c
data:
  config.properties: |
    edc.connector.name=FactoryC
    edc.connector.ids.id=urn:connector:factory-c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edc-factory-a
  namespace: industrial-data-space
  labels:
    app: edc-connector
    factory: factory-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edc-connector
      factory: factory-a
  template:
    metadata:
      labels:
        app: edc-connector
        factory: factory-a
    spec:
      containers:
        - name: edc-connector
          image: industrial-data-space/edc-connector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: EDC_CONNECTOR_NAME
              value: "FactoryA"
            - name: EDC_CONNECTOR_ID
              value: "urn:connector:factory-a"
            - name: EDC_CONNECTOR_PORT
              value: "8080"
            - name: EDC_CONFIG_PATH
              value: "/app/config/config.properties"
            - name: EDC_FLOWER_SERVER
              value: "flower-server:8080"
            - name: EDC_OTHER_CONNECTORS
              value: "http://edc-factory-b:8081,http://edc-factory-c:8082"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: edc-config-factory-a
---
