apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: industrial-data-space
  labels:
    app.kubernetes.io/part-of: federated-learning-platform
data:
  MQTT_BROKER_HOST: "mqtt-broker"
  MQTT_BROKER_PORT: "1883"
  FLOWER_SERVER_HOST: "flower-server"
  FLOWER_SERVER_PORT: "8080"
  FASTAPI_HOST: "0.0.0.0"
  FASTAPI_PORT: "8000"
  STREAMLIT_PORT: "8501"
  IOT_SIM_INTERVAL: "10"
  IOT_DATA_DIR: "/data"
  FACTORY_IDS: "FactoryA,FactoryB,FactoryC"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: industrial-data-space
  labels:
    app.kubernetes.io/part-of: federated-learning-platform
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest file /mosquitto/log/mosquitto.log
    listener 9001
    protocol websockets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edc-config
  namespace: industrial-data-space
  labels:
    app.kubernetes.io/part-of: federated-learning-platform
data:
  config-factory-a.properties: |
    edc.connector.name=FactoryA
    edc.connector.port=8080
    edc.connector.host=edc-factory-a
    edc.connector.protocol=http
    edc.connector.ids.id=urn:connector:factory-a
    edc.contract.negotiation.enabled=true
    edc.contract.negotiation.timeout=300
    edc.participant.id=urn:factory:factory-a
    edc.participant.name=Factory A Connector
    edc.data.address=http://localhost:8080
    edc.control.address=http://localhost:8080
    edc.management.address=http://localhost:8080
    edc.asset.management.enabled=true
    edc.contract.definition.enabled=true
    edc.federatedlearning.enabled=true
    edc.federatedlearning.flower.server=flower-server:8080
  config-factory-b.properties: |
    edc.connector.name=FactoryB
    edc.connector.port=8080
    edc.connector.host=edc-factory-b
    edc.connector.protocol=http
    edc.connector.ids.id=urn:connector:factory-b
    edc.contract.negotiation.enabled=true
    edc.contract.negotiation.timeout=300
    edc.participant.id=urn:factory:factory-b
    edc.participant.name=Factory B Connector
    edc.data.address=http://localhost:8080
    edc.control.address=http://localhost:8080
    edc.management.address=http://localhost:8080
    edc.asset.management.enabled=true
    edc.contract.definition.enabled=true
    edc.federatedlearning.enabled=true
    edc.federatedlearning.flower.server=flower-server:8080
  config-factory-c.properties: |
    edc.connector.name=FactoryC
    edc.connector.port=8080
    edc.connector.host=edc-factory-c
    edc.connector.protocol=http
    edc.connector.ids.id=urn:connector:factory-c
    edc.contract.negotiation.enabled=true
    edc.contract.negotiation.timeout=300
    edc.participant.id=urn:factory:factory-c
    edc.participant.name=Factory C Connector
    edc.data.address=http://localhost:8080
    edc.control.address=http://localhost:8080
    edc.management.address=http://localhost:8080
    edc.asset.management.enabled=true
    edc.contract.definition.enabled=true
    edc.federatedlearning.enabled=true
    edc.federatedlearning.flower.server=flower-server:8080
