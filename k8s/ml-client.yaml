---
apiVersion: v1
kind: Namespace
metadata:
  name: federated-learning
  labels:
    app.kubernetes.io/part-of: industrial-data-space
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-client-config-factory-a
  namespace: federated-learning
  labels:
    app: ml-client
    factory: factory-a
data:
  FACTORY_ID: "factory-a"
  DATA_DIR: "/data/factory-a"
  SERVER_ADDRESS: "flower-server:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-client-config-factory-b
  namespace: federated-learning
  labels:
    app: ml-client
    factory: factory-b
data:
  FACTORY_ID: "factory-b"
  DATA_DIR: "/data/factory-b"
  SERVER_ADDRESS: "flower-server:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-client-config-factory-c
  namespace: federated-learning
  labels:
    app: ml-client
    factory: factory-c
data:
  FACTORY_ID: "factory-c"
  DATA_DIR: "/data/factory-c"
  SERVER_ADDRESS: "flower-server:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-client-factory-a
  namespace: federated-learning
  labels:
    app: ml-client
    factory: factory-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-client
      factory: factory-a
  template:
    metadata:
      labels:
        app: ml-client
        factory: factory-a
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: ml-client
          image: federated-learning:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "client.py"]
          args:
            - "--factory-id=$(FACTORY_ID)"
            - "--data-dir=$(DATA_DIR)"
            - "--server-address=$(SERVER_ADDRESS)"
          envFrom:
            - configMapRef:
                name: ml-client-config-factory-a
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "client.py" > /dev/null
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "client.py" > /dev/null
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "client.py" > /dev/null
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      restartPolicy: Always
---
