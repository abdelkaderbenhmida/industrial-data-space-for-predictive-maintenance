apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: industrial-data-space
  labels:
    app: mqtt-broker
    app.kubernetes.io/name: mqtt-broker
    app.kubernetes.io/part-of: federated-learning-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
              name: mqtt
              protocol: TCP
            - containerPort: 9001
              name: websocket
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-log
              mountPath: /mosquitto/log
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
        - name: mosquitto-data
          emptyDir: {}
        - name: mosquitto-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: industrial-data-space
  labels:
    app: mqtt-broker
    app.kubernetes.io/name: mqtt-broker
    app.kubernetes.io/part-of: federated-learning-platform
spec:
  type: ClusterIP
  selector:
    app: mqtt-broker
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
    - name: websocket
      port: 9001
      targetPort: 9001
      protocol: TCP
